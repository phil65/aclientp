# Conformance of `aclientp.schema.v2` against the pinned upstream schema (see VERSION).
#
# Checked by `uv run python -m aclientp.schema_reference --protocol 2 check` and
# tests/test_schema_reference.py. Every difference reported by the check must be
# listed under [known] with a reason; listed differences that no longer occur fail
# the check too, so remove them once fixed.

# v2 sends None as null and leaves MISSING fields out, so nullability must match.
check_nullability = true

# Numeric and length constraints (minimum, minItems, ...) must match too.
check_constraints = true


[renames]
# Upstream definition name = our name (models, unions and Literal aliases).

[known]
# Finding id = reason.
"extra-field:AgentNotification.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:AgentRequest.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ClientNotification.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ClientRequest.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ProxyNotification.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"
"extra-field:ProxyRequest.jsonrpc" = "upstream adds jsonrpc at the top level of the schema, not per envelope"

# Found by the `not` / `if`-`then` probes (behaviour, not fields).
"conditional:Error.code->data" = "Error is also read from peers: a -32022 without data stays readable instead of failing the whole message"
"constraint:InitializeProxyRequest.protocolVersion" = "ProtocolVersion stays an unbounded int, so initialize can answer an out-of-range version with its own"
"constraint:InitializeProxyResponse.protocolVersion" = "ProtocolVersion stays an unbounded int, so initialize can answer an out-of-range version with its own"
"constraint:InitializeRequest.protocolVersion" = "ProtocolVersion stays an unbounded int, so initialize can answer an out-of-range version with its own"
"constraint:InitializeResponse.protocolVersion" = "ProtocolVersion stays an unbounded int, so initialize can answer an out-of-range version with its own"
"constraint:UnsupportedProtocolVersionErrorData.requested" = "ProtocolVersion stays an unbounded int, so initialize can answer an out-of-range version with its own"
