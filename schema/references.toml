# Reference implementations of ACP, pinned by commit.
#
# The models in aclientp.schema / aclientp.schema.v2 follow the pinned schemas in v1/ and v2/.
# These pins point at implementations built on the same schema releases, to read
# how upstream implements the runtime side (connections, version routing, sessions),
# and to see what changed since: `uv run python -m aclientp.schema_reference refs`.
# Move a pin with `refs --update NAME` after reviewing the listed commits.

[typescript-sdk]
repo = "agentclientprotocol/typescript-sdk"
commit = "be320929c2b0a0fe7764023f83fbe307445c36d1"
schema = ["schema-v1.34.1", "schema-v2.0.0-beta.3"]
paths = ["src/protocol-router.ts", "src/v2", "src/core/jsonrpc.ts", "src/v1"]
description = "Official TypeScript SDK: version router, v1/v2 agent and client bindings"

[claude-agent-acp]
repo = "agentclientprotocol/claude-agent-acp"
commit = "105e1c38daf76bc832e872e95904be6dabd32372"
schema = ["schema-v1.34.1", "schema-v2.0.0-beta.3"]
paths = ["src/v2", "src/v1/acp-agent.ts"]
description = "Claude Code ACP adapter (v0.110.0): a production agent serving v1 and v2"
